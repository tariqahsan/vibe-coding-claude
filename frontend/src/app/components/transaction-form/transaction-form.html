<mat-card>
  <mat-card-header>
    <mat-card-title>New Transaction</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-button-toggle-group [(ngModel)]="transactionType" class="toggle-group">
      <mat-button-toggle value="CREDIT">
        <mat-icon>add_circle</mat-icon>
        Credit
      </mat-button-toggle>
      <mat-button-toggle value="DEBIT">
        <mat-icon>remove_circle</mat-icon>
        Debit
      </mat-button-toggle>
    </mat-button-toggle-group>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Amount</mat-label>
      <input matInput type="number" [(ngModel)]="amount" placeholder="0.00" min="0.01" step="0.01" />
      <span matPrefix>$&nbsp;</span>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <input matInput [(ngModel)]="description" placeholder="Enter description" />
    </mat-form-field>
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button [color]="transactionType === 'CREDIT' ? 'primary' : 'warn'" (click)="submitTransaction()">
      <mat-icon>{{ transactionType === 'CREDIT' ? 'add_circle' : 'remove_circle' }}</mat-icon>
      {{ transactionType === 'CREDIT' ? 'Credit' : 'Debit' }} Account
    </button>
  </mat-card-actions>
</mat-card>
